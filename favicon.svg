  <circle cx="47" cy="18" r="1.5" fill="#FFC107"/>

  <!-- Coding symbol -->
  <path d="M23 29 L19 32 L23 35"
        fill="none" stroke="#00CFFF"
        stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M29 29 L26 35"
