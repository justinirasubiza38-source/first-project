        stroke-width="2" stroke-linecap="round"/>

  <path d="M32 29 L36 32 L32 35"
        fill="none" stroke="#00CFFF"
        stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Gold orbit -->
  <path d="M8 42
